name: PR gate

# Squish does not accept unsolicited pull requests (see CONTRIBUTING.md).
# Any pull request whose author is not in .github/MAINTAINERS or
# .github/APPROVED_CONTRIBUTORS is closed with an explanation. A maintainer
# can reopen one as an exception; reopening by anyone else closes it again.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    if: github.repository == 'bring-shrubbery/squish'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request against the contribution policy
        uses: actions/github-script@v9
        with:
          script: |
            const MARKER = '<!-- squish:pr-gate -->';
            const pr = context.payload.pull_request;
            const author = pr.user.login.toLowerCase();
            const branch = context.payload.repository.default_branch;

            const read = async (path) => {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: branch });
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const parse = (text) => new Set(text.split('\n')
              .map(l => l.trim().toLowerCase())
              .filter(l => l && !l.startsWith('#')));

            const maintainers = parse(await read('.github/MAINTAINERS'));
            const approved = parse(await read('.github/APPROVED_CONTRIBUTORS'));

            const hasWriteAccess = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username });
                return ['admin', 'maintain', 'write'].includes(data.permission);
              } catch { return false; }
            };
            const isMaintainer = async (username) =>
              !!username && maintainers.has(username.toLowerCase()) && await hasWriteAccess(username);

            if (pr.user.type === 'Bot') { core.info(`bot PR from ${author}; leaving open`); return; }
            if (await isMaintainer(pr.user.login)) { core.info(`${author} is a maintainer`); return; }
            if (approved.has(author)) { core.info(`${author} is an approved contributor`); return; }

            // A maintainer reopening a closed PR is the one sanctioned exception.
            if (context.payload.action === 'reopened') {
              if (await isMaintainer(context.payload.sender.login)) {
                core.info('reopened by a maintainer; leaving open');
                return;
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: pr.number, per_page: 100 });
            const already = comments.find(c => c.body && c.body.includes(MARKER));
            const body = [
              MARKER,
              `Hi @${pr.user.login}, thanks for your interest in Squish.`,
              '',
              'Squish does not accept pull requests from accounts that are not listed in `.github/APPROVED_CONTRIBUTORS`, so this one is being closed automatically. This is a policy about how the project is built, not a judgement of your work: the code is written by agents the maintainers run and supervise, and a well described problem is worth more to us than a patch.',
              '',
              '- Found a bug you can reproduce? Please file it with the [bug template](https://github.com/bring-shrubbery/squish/issues/new/choose).',
              '- Want a feature or a change? Please make the case in [Discussions](https://github.com/bring-shrubbery/squish/discussions); the ideas with the most support are what gets built next.',
              '',
              'The reasoning is in [CONTRIBUTING.md](https://github.com/bring-shrubbery/squish/blob/main/CONTRIBUTING.md). A maintainer can reopen this as an exception; reopening by anyone else will close it again.',
            ].join('\n');
            if (!already) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: 'closed' });

name: CLI CI

# The squish command-line tool in cli/: formatting, lints and tests on macOS and Linux.
# A green run on main lets cli-release.yml publish a new version.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-*.yml"
      - "scripts/release-cli-*"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-*.yml"
      - "scripts/release-cli-*"
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  formula:
    name: Formula script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/release-cli-formula-test.sh

[package]
name = "squish-cli"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Find the git worktrees your coding agents left behind and clean them up safely."
license = "Apache-2.0"
repository = "https://github.com/bring-shrubbery/squish"
homepage = "https://squish.quassum.com"
publish = false

[[bin]]
name = "squish"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
